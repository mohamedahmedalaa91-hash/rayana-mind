<script>/* RAYANA MIND standalone runtime: local data store + Claude API brain (replaces the claude.ai capabilities) */
(function(){
if(window.claude&&window.claude.use)return;
window.RM_STANDALONE=true;
var KEY="rm-db",DB={};try{DB=JSON.parse(localStorage.getItem(KEY)||"{}")||{};}catch(e){DB={};}
if((!DB||!Object.keys(DB).length)&&window.RM_SEED&&window.RM_SEED.collections){DB=JSON.parse(JSON.stringify(window.RM_SEED.collections));try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
var subs=[];function clone(v){return v==null?v:JSON.parse(JSON.stringify(v));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){console.warn("storage full",e);}subs.slice().forEach(function(f){try{f();}catch(e){}});}
function col(n){return DB[n]||(DB[n]={});}
function rid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36);}
function docRef(c,id){return {id:id,
 get:function(){var d=(DB[c]||{})[id];return Promise.resolve({exists:!!d,id:id,data:function(){return clone(d);}});},
 set:function(v){col(c)[id]=clone(v);save();return Promise.resolve();},
 update:function(v){var cur=col(c)[id]||{};var nv=clone(v);Object.keys(nv).forEach(function(k){cur[k]=nv[k];});col(c)[id]=cur;save();return Promise.resolve();},
 delete:function(){delete col(c)[id];save();return Promise.resolve();},
 onSnapshot:function(cb){var f=function(){var d=(DB[c]||{})[id];cb({exists:!!d,id:id,data:function(){return clone(d);}});};subs.push(f);setTimeout(f,0);return function(){var i=subs.indexOf(f);if(i>=0)subs.splice(i,1);};}};}
var db={collection:function(n){return {doc:function(id){return docRef(n,id||rid());},
  onSnapshot:function(cb){var f=function(){cb({docs:Object.keys(DB[n]||{}).map(function(id){var d=DB[n][id];return {id:id,data:function(){return clone(d);}};})});};subs.push(f);setTimeout(f,0);return function(){var i=subs.indexOf(f);if(i>=0)subs.splice(i,1);};}};},
 doc:function(p){var s=p.split("/");return docRef(s[0],s[1]);}};
window.RM_IMPORT=function(cols){DB=clone(cols)||{};save();};
function getKey(){try{return JSON.parse(localStorage.getItem("nx-k")||'""');}catch(e){return "";}}
function getModel(){try{return JSON.parse(localStorage.getItem("nx-m")||'"claude-sonnet-5-5"');}catch(e){return "claude-sonnet-5-5";}}
function asMsgs(input){return typeof input==="string"?[{role:"user",content:input}]:input.map(function(m){return {role:m.role,content:m.content};});}
async function run(input,opts){opts=opts||{};var key=getKey();if(!key)throw {code:"not_granted",message:"no key"};
 var tools=(opts.tools||[]).map(function(t){return {name:t.name,description:t.description||"",input_schema:t.inputSchema||{type:"object",properties:{}}};});
 var msgs=asMsgs(input),text="";
 for(var turn=0;turn<8;turn++){
  var r;try{r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal:opts.signal,headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
   body:JSON.stringify(Object.assign({model:getModel(),max_tokens:4096,messages:msgs},tools.length?{tools:tools}:{}))});}
  catch(e){if(e&&e.name==="AbortError")throw {code:"cancelled",text:text};throw {code:"network",text:text};}
  if(r.status===429||r.status===529)throw {code:"rate_limited",text:text};
  if(r.status===401||r.status===403)throw {code:"bad_key",text:text};
  if(!r.ok)throw {code:"api_error",message:(await r.text()).slice(0,300),text:text};
  var j=await r.json();var tx=(j.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("");
  if(tx){text+=(text?"\n":"")+tx;if(opts.onText)opts.onText({text:text,delta:tx});}
  var uses=(j.content||[]).filter(function(b){return b.type==="tool_use";});
  if(j.stop_reason!=="tool_use"||!uses.length)return {text:text,truncated:j.stop_reason==="max_tokens"};
  msgs.push({role:"assistant",content:j.content});var results=[];
  for(var i=0;i<uses.length;i++){var u=uses[i],t=(opts.tools||[]).find(function(x){return x.name===u.name;}),out,err=false;
   try{out=t?await t.execute(u.input||{}):"unknown tool";}catch(e){out=String(e&&e.message||e);err=true;}
   results.push({type:"tool_result",tool_use_id:u.id,content:JSON.stringify(out===undefined?null:out).slice(0,20000),is_error:err});}
  msgs.push({role:"user",content:results});}
 return {text:text,truncated:true};}
var sample=function(input,opts){return run(input,opts);};
sample.json=async function(input,opts){var res=await run(input,opts);var m=res.text.match(/\{[\s\S]*\}|\[[\s\S]*\]/);if(!m)throw {code:"invalid_json"};try{return JSON.parse(m[0]);}catch(e){throw {code:"invalid_json"};}};
window.claude={use:function(n){if(n==="db")return Promise.resolve(db);if(n==="sample")return Promise.resolve(getKey()?sample:null);return Promise.resolve(null);}};
})();
</script>
<title>RAYANA MIND</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* NEXUS HQ for Rayana — executive command center. Nav rail (right) · command surface · intelligence panel (left) · floating hologram assistant. Single deliberate dark world: obsidian base, Rayana gold for decisions, holo cyan only for the assistant. */
:root{
  --bg:#040E26; --surface:#0A1A3D; --surface-2:#0F2350; --glass:rgba(12,30,70,.72);
  --line:#173064; --line-2:#22417E; --edge:rgba(255,255,255,.06);
  --text:#EAF3FF; --text-2:#9DB4D8; --text-3:#6E86AE;
  --gold:#F3C440; --gold-ink:#15120A;
  --holo:#5FD0FF; --holo-2:#2E8BFF; --think:#9B7BFF; --emerald:#3DDC97;
  --ok:#3DDC97; --warn:#F0A04B; --crit:#F2675C;
  --d-exec:#F3C440; --d-ops:#F0A04B; --d-fin:#5FC8B4; --d-sales:#E07AB8; --d-admin:#8C9BFF; --d-growth:#7DD87A;
  --f-display:'Alexandria','IBM Plex Sans Arabic',Tahoma,sans-serif;
  --f-body:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',sans-serif;
  --f-mono:'Alexandria','IBM Plex Sans Arabic',Tahoma,sans-serif;
  --r-sm:6px; --r-md:10px; --r-lg:16px;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--text)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;
  background-image:radial-gradient(1200px 700px at 60% -10%,rgba(46,139,255,.22),transparent 60%),radial-gradient(900px 500px at 10% 110%,rgba(243,196,64,.06),transparent 60%);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--text-2)} .dim{color:var(--text-3)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance}
/* shell */
.shell{direction:rtl;display:grid;grid-template-columns:76px minmax(0,1fr) 320px;grid-template-rows:auto 1fr;min-height:100%;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.hdr{grid-column:1/-1;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px));
  background:rgba(4,14,38,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--gold);color:var(--gold-ink);font-family:var(--f-display);font-size:16px}
.brand b{font-family:var(--f-display);font-size:18px;letter-spacing:.02em}
.brand small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--text-3);letter-spacing:.14em;direction:ltr;text-align:right}
.status{display:flex;gap:6px;flex-wrap:wrap}
.sys{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--text-2)}
.sys i{width:7px;height:7px;border-radius:50%;background:var(--text-3)}
.sys.on i{background:var(--ok);box-shadow:0 0 8px var(--ok)} .sys.off i{background:var(--crit)} .sys.part i{background:var(--warn)}
.spacer{flex:1}
.qa{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line-2);background:var(--surface-2);border-radius:var(--r-sm);padding:6px 12px;font-size:13.5px;transition:border-color .16s var(--ease),background .16s}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:600}
.btn.holo{border-color:rgba(95,227,255,.5);color:var(--holo)}
.btn.sm{padding:3px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bell{position:relative}
.bell b{position:absolute;top:-6px;left:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--crit);color:#160806;font-size:11px;display:grid;place-items:center;padding:0 4px}
.clock{font-family:var(--f-mono);font-size:12px;color:var(--text-2);text-align:left;direction:ltr;line-height:1.3}
.clock b{display:block;color:var(--gold);font-size:17px;font-weight:600}
/* nav rail */
.rail{grid-row:2;border-left:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:4px;position:sticky;top:64px;align-self:start;max-height:calc(100vh - 64px);overflow-y:auto}
.rail a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:var(--r-md);color:var(--text-2);text-decoration:none;font-size:11px;text-align:center;border:1px solid transparent}
.rail a svg{width:20px;height:20px}
.rail a:hover{color:var(--text);background:var(--surface-2)}
.rail a[aria-current="page"]{color:var(--gold);background:rgba(243,196,64,.08);border-color:rgba(243,196,64,.25)}
/* main */
.main{grid-row:2;min-width:0;padding:18px max(16px,env(safe-area-inset-left,0px)) 120px 18px;display:flex;flex-direction:column;gap:16px}
.view-h{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.view-h h1{font-size:26px}
.view-h p{margin:2px 0 0;color:var(--text-2);font-size:13.5px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;color:var(--holo);direction:ltr;text-align:right}
.panel{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--edge);border-radius:var(--r-lg);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:16px}
.panel-b{padding:14px 16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:right;cursor:pointer}
.kpi:hover{border-color:var(--line-2)}
.kpi b{font-family:var(--f-mono);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--text-2)}
.kpi.crit b{color:var(--crit)} .kpi.gold b{color:var(--gold)} .kpi.holo b{color:var(--holo)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;border-inline-start:3px solid var(--line-2);min-width:0}
.card.red{border-inline-start-color:var(--crit)} .card.yellow{border-inline-start-color:var(--warn)} .card.green{border-inline-start-color:var(--ok)} .card.gold{border-inline-start-color:var(--gold)} .card.holo{border-inline-start-color:var(--holo)}
.card b{display:block;font-size:14px;overflow-wrap:anywhere}
.card p{margin:4px 0 0;font-size:13px;color:var(--text-2);overflow-wrap:anywhere;white-space:pre-line}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--text-2)}
.pill{border:1px solid var(--line-2);border-radius:999px;padding:0 8px;font-size:11.5px;white-space:nowrap}
.pill.red{color:var(--crit);border-color:rgba(242,103,92,.45)} .pill.yellow{color:var(--warn);border-color:rgba(240,160,75,.45)} .pill.green{color:var(--ok);border-color:rgba(61,220,151,.45)} .pill.gold{color:var(--gold);border-color:rgba(243,196,64,.45)} .pill.holo{color:var(--holo);border-color:rgba(95,227,255,.4)}
.fig{margin-top:6px;font-family:var(--f-mono);font-size:12px;color:var(--gold);font-variant-numeric:tabular-nums;white-space:pre-line}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.mt{margin-top:8px}
.empty{border:1px dashed var(--line-2);border-radius:var(--r-md);padding:14px;color:var(--text-3);font-size:13px}
.note{font-size:12.5px;color:var(--text-3)}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.col h3{font-size:14px;font-family:var(--f-body);font-weight:600;color:var(--text-2);display:flex;justify-content:space-between;margin-bottom:8px}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface-2);border-radius:999px;padding:3px 12px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.field{background:var(--bg);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:7px 10px;min-width:0}
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t th{color:var(--text-2);font-weight:500;font-size:12px}
table.t td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lvl{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:11.5px;color:var(--gold)}
.lvl i{width:7px;height:7px;border-radius:2px;background:var(--line-2)} .lvl i.on{background:var(--gold)}
.brief-card.active{border-color:var(--holo);box-shadow:0 0 0 1px rgba(95,227,255,.35),0 0 24px rgba(95,227,255,.12)}
.brief-card{transition:border-color .3s,box-shadow .3s}
.wa{white-space:pre-line;font-size:14px;margin-top:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
/* intel */
.intel{grid-row:2;border-right:1px solid var(--line);padding:18px 16px 120px;display:flex;flex-direction:column;gap:14px;min-width:0}
.intel h2{font-size:14px;font-family:var(--f-body);font-weight:600;color:var(--text-2);display:flex;justify-content:space-between;margin-bottom:8px}
.feed{display:flex;flex-direction:column;gap:0}
.feed-i{display:grid;grid-template-columns:10px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.feed-i i{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--holo)}
.feed-i small{display:block;color:var(--text-3);font-size:11.5px}
/* map */
.map svg{width:100%;height:auto;display:block}
.node{cursor:pointer} .node:focus{outline:none} .node:focus-visible .ring{stroke:var(--text);stroke-width:3}
.core-spin{transform-origin:500px 400px;animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{r:30;opacity:.9}100%{r:62;opacity:0}}
.pulse{animation:pulse 1.4s ease-out 2}
/* assistant dock */
.dock{position:fixed;z-index:40;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));direction:rtl}
.orb{width:76px;height:76px;border-radius:50%;border:1px solid rgba(95,227,255,.35);background:radial-gradient(circle at 50% 40%,rgba(95,227,255,.14),rgba(7,8,11,.92) 70%);box-shadow:0 0 28px rgba(95,227,255,.18);display:block;padding:0;overflow:hidden;position:relative}
.orb canvas{width:100%;height:100%;display:block}
.orb-tag{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;color:var(--holo);background:var(--bg);padding:0 6px;border-radius:6px;direction:ltr}
.chatbox{position:fixed;z-index:41;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:400px;max-width:calc(100vw - 32px);height:min(640px,calc(100vh - 110px));
  display:flex;flex-direction:column;background:rgba(6,18,46,.94);backdrop-filter:blur(18px);border:1px solid rgba(95,227,255,.22);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 40px rgba(95,227,255,.08);direction:rtl}
.chat-top{display:grid;grid-template-columns:88px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.chat-top canvas{width:88px;height:100px;display:block}
.chat-top h2{font-size:16px}
.mode{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;direction:ltr;text-align:right}
.mode.idle{color:var(--text-3)} .mode.listening{color:var(--holo)} .mode.thinking{color:var(--think)} .mode.speaking{color:var(--emerald)}
.chat-log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;border-radius:12px;padding:9px 12px;font-size:14px;line-height:1.65;overflow-wrap:anywhere}
.msg.me{align-self:flex-start;background:var(--gold);color:var(--gold-ink)}
.msg.cos{align-self:flex-end;background:var(--surface-2);border:1px solid var(--line-2)}
.msg.cos .who{display:block;font-family:var(--f-display);font-size:12px;color:var(--holo);margin-bottom:2px}
.msg.sys{align-self:center;color:var(--text-3);font-size:12.5px;border:1px dashed var(--line);max-width:100%}
.msg ul{margin:4px 0;padding-inline-start:18px}
.msg .act{display:block;margin-top:6px;font-size:12px;color:var(--emerald)}
.composer{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}
.composer textarea{width:100%;resize:none;height:64px;background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:9px 10px;font-size:14px}
.mic{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface-2);display:grid;place-items:center;padding:0}
.mic.on,.nx-btn.mic-on{border-color:var(--crit)!important;color:var(--crit)!important;box-shadow:0 0 0 3px rgba(242,103,92,.25),0 0 18px rgba(242,103,92,.5);animation:micpulse 1.2s ease-in-out infinite}
@keyframes micpulse{50%{box-shadow:0 0 0 7px rgba(242,103,92,.12),0 0 24px rgba(242,103,92,.6)}}
@media (prefers-reduced-motion:reduce){.mic.on,.nx-btn.mic-on{animation:none}}
.mic svg{width:18px;height:18px}
.iconbtn{border:none;background:none;color:var(--text-2);padding:6px;border-radius:8px}
.iconbtn:hover{color:var(--text);background:var(--surface-2)}
/* immersive + launch */
.stage{position:fixed;inset:0;z-index:70;background:radial-gradient(ellipse at 50% 35%,#0C2A62 0%,#040E26 60%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;direction:rtl;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transition:opacity .7s var(--ease),transform .7s var(--ease)}

/* ===== NEXUS constellation (home): blue field, gold core = Rayyan, agents as nodes ===== */
body.on-core .dock{display:none}
.nexus{position:fixed;inset:0;z-index:38;overflow:hidden;direction:ltr;color:#EAF4FF;
  background:radial-gradient(ellipse 75% 65% at var(--nx-cx,50%) 47%,#1356BE 0%,#0C3E95 26%,#082C6E 50%,#05194A 76%,#030E2B 100%)}
.nx-cv{position:absolute;inset:0;display:block}

.nx-node .dot{position:relative;flex:none;width:22px;height:22px;border-radius:50%;border:2.5px solid #5FD0FF;background:radial-gradient(circle,#0B2F6E 45%,#0E46A0);
  box-shadow:0 0 14px rgba(95,208,255,.85),inset 0 0 6px rgba(95,208,255,.6)}
.nx-node.gold .dot{border-color:#F3C440;background:radial-gradient(circle,#2A2410 40%,#4A3C12);box-shadow:0 0 14px rgba(243,196,64,.85),inset 0 0 6px rgba(243,196,64,.5)}
.nx-node .lbl{white-space:nowrap;direction:rtl;text-shadow:0 1px 10px rgba(0,20,60,.95)}
.nx-node:hover .lbl,.nx-node:focus-visible .lbl{color:#fff;text-decoration:underline;text-underline-offset:5px}
.nx-node .bdg{position:absolute;top:-9px;right:-9px;min-width:17px;height:17px;border-radius:9px;background:var(--crit);color:#1B0806;font:700 11px var(--f-mono);display:grid;place-items:center;padding:0 3px}
.nx-node.int{font-size:13.5px;font-weight:500;color:#86C2FF}
.nx-node.int .dot{width:15px;height:15px;border:1.6px dashed rgba(134,194,255,.85);background:transparent;box-shadow:none}
.nx-node.int.ok .dot{border-style:solid;background:radial-gradient(circle,#0B2F6E 40%,#1557B8);box-shadow:0 0 10px rgba(95,208,255,.6)}
.nx-node.int.r{transform:translate(-13px,-50%)} .nx-node.int.l{transform:translate(calc(-100% + 13px),-50%)}
.nx-pill{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;
  padding:5px 14px;border-radius:999px;background:rgba(4,20,52,.75);border:1px solid rgba(95,208,255,.35);font:600 12px var(--f-body);direction:rtl;white-space:nowrap;color:#BFE6FF}
.nx-pill i{width:7px;height:7px;border-radius:50%;background:#5FD0FF;box-shadow:0 0 8px #5FD0FF}
.nx-pill.speaking i{background:var(--gold);box-shadow:0 0 8px var(--gold)} .nx-pill.thinking i{background:var(--think);box-shadow:0 0 8px var(--think)}
.nx-side{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));right:max(20px,env(safe-area-inset-right,0px));width:256px;direction:rtl;display:flex;flex-direction:column;gap:10px}
.nx-clock{display:flex;align-items:baseline;gap:12px}
.nx-clock b{font:600 40px/1 var(--f-mono);color:#7FD6FF;letter-spacing:1px;white-space:nowrap} .nx-clock span{font-size:12px;color:#8FB3E0}
.nx-hello{font:700 15px var(--f-display);color:#EAF4FF} .nx-today{font-size:12.5px;color:#A9C6EC;line-height:1.6}
.nx-today b{color:#7FD6FF;font-weight:600}
.nx-status{display:flex;gap:10px;font-size:11.5px;color:#9DB4D8} .nx-status i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-inline-end:4px;background:var(--ok)} .nx-status i.off{background:var(--crit)} .nx-status i.part{background:var(--warn)}
.nx-checks{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.nx-checks li{display:grid;grid-template-columns:18px 1fr;gap:9px;align-items:start;opacity:.35;transition:opacity .3s}

.nx-checks .bx{width:16px;height:16px;border:1.4px solid rgba(143,179,224,.6);border-radius:3px;display:grid;place-items:center;font-size:11px;line-height:1;margin-top:2px}
.nx-checks li.ok .bx{border-color:#EAF4FF;color:#EAF4FF} .nx-checks li.warn .bx{border-color:var(--warn);color:var(--warn)} .nx-checks li.off .bx{border-color:var(--crit);color:var(--crit)}
.nx-checks b{display:block;font:600 12px var(--f-body);color:#DCEBFF} .nx-checks small{display:block;font:11.5px var(--f-body);color:#8FB0DA}
.nx-result{position:absolute;left:max(24px,env(safe-area-inset-left,0px));top:calc(70px + env(safe-area-inset-top,0px));width:230px;direction:rtl;text-align:right;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;opacity:0;transition:opacity .6s;pointer-events:none}

.nx-result b{display:block;font:700 13px var(--f-display);letter-spacing:.5px;color:#DCEBFF} .nx-result small{display:block;font-size:11.5px;color:#8FB3E0;margin-top:2px}

.nx-cap{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));width:min(640px,calc(100% - 32px));text-align:center;direction:rtl;
  font:500 16px/1.7 var(--f-body);color:#EAF4FF;text-shadow:0 2px 12px rgba(0,20,60,.95);min-height:1.7em}
.nx-dock{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:14px;direction:rtl}
.nx-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:rgba(4,20,52,.8);border:1px solid rgba(95,208,255,.3);color:#CFE6FF;font:600 12.5px var(--f-body);white-space:nowrap}
.nx-btn:hover{border-color:rgba(95,208,255,.7)} .nx-btn.gold{border-color:rgba(243,196,64,.55);color:var(--gold)}

.nx-wave{width:250px;text-align:center} .nx-wave span{display:block;font:600 10.5px var(--f-mono);letter-spacing:3px;color:#BFD8F5;margin-top:44px}
.nx-corner{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:max(20px,env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:center}
.nx-brand{font:700 13px var(--f-display);letter-spacing:2px;color:#9FC9F5;direction:ltr}
.nx-pop{position:absolute;width:250px;direction:rtl;background:rgba(5,22,58,.95);border:1px solid rgba(95,208,255,.4);border-radius:12px;padding:12px 14px;box-shadow:0 12px 40px rgba(0,10,40,.6);z-index:2}
.nx-pop b{font:700 15px var(--f-display)} .nx-pop p{margin:4px 0 8px;font-size:12.5px;color:#A9C6EC}
.nx-pop .row{gap:6px}
.nx-sum{display:none}

/* RAYANA MIND additions: data-kind badges, metric tiles, confidence bars */
.kind{font-size:11px;border-radius:999px;padding:0 8px;border:1px solid var(--line-2);white-space:nowrap}
.kind.actual{color:var(--ok);border-color:rgba(61,220,151,.45)} .kind.historical{color:var(--text-2)} .kind.forecast{color:var(--think);border-color:rgba(155,123,255,.45)}
.kind.ai{color:var(--holo);border-color:rgba(95,227,255,.4)} .kind.unverified{color:var(--warn);border-color:rgba(240,160,75,.45);border-style:dashed} .kind.awaiting{color:var(--gold);border-color:rgba(243,196,64,.45)} .kind.na{color:var(--text-3);border-style:dashed}
.mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}

.met>.kind{align-self:flex-start}

.conf{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;flex:1;min-width:80px} .conf i{display:block;height:100%;background:linear-gradient(90deg,var(--think),var(--holo))}
.steps{margin:6px 0 0;padding:0 18px 0 0;display:flex;flex-direction:column;gap:6px} .steps li{line-height:1.6} .steps b{color:var(--holo);font-weight:500}

/* ================= DESIGN SYSTEM v3 · "المكتب الفني بالليل" =================
   Blueprint sheet (cyanotype ink + drafting grid), brass for decisions and for Rayyan's voice,
   signal blue only for live activity. Alexandria (display/numbers) + IBM Plex Sans Arabic (text & commands). */
:root{
  --bg:#061434; --surface:#0C1F4A; --surface-2:#12295C; --sheet:rgba(11,29,70,.92);
  --line:#1C3670; --line-2:#2A4C8C; --hair:rgba(150,190,255,.14);
  --text:#EEF3FF; --text-2:#A9BCDD; --text-3:#7D93BA;
  --gold:#F3C440; --gold-hi:#FFD660; --gold-ink:#1B1503; --holo:#6FD3FF; --think:#A68BFF;
  --ok:#43D39B; --warn:#F2A65A; --crit:#F06A5E;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --t-xs:12px; --t-sm:13.5px; --t-md:15px; --t-lg:18px; --t-xl:23px; --t-2xl:30px;
}
body{font-size:var(--t-md);line-height:1.7;font-feature-settings:"kern";-webkit-font-smoothing:antialiased;background-color:var(--bg);
  background-image:radial-gradient(1100px 640px at 62% -10%,rgba(52,120,255,.20),transparent 62%),
    linear-gradient(rgba(150,190,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(150,190,255,.045) 1px,transparent 1px),
    linear-gradient(rgba(150,190,255,.075) 1px,transparent 1px),linear-gradient(90deg,rgba(150,190,255,.075) 1px,transparent 1px);
  background-size:auto,24px 24px,24px 24px,120px 120px,120px 120px;background-attachment:fixed}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:0;line-height:1.3}
.mono,.kpi b,.met .v,.clock b,.lvl,table.t td.n,.fig{font-family:var(--f-display);font-variant-numeric:tabular-nums lining-nums;letter-spacing:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
::selection{background:rgba(243,196,64,.35);color:#fff}

/* header: brand plate + command group */
.hdr{background:rgba(6,20,52,.9);border-bottom:1px solid var(--hair);gap:16px;padding-top:10px;padding-bottom:10px}
.brand-mark{width:38px;height:38px;border-radius:10px;font:700 19px/1 var(--f-display);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.brand b{font:600 17px/1.3 var(--f-display);letter-spacing:0}
.brand small{font:400 12px/1.4 var(--f-body);letter-spacing:0;direction:rtl;text-align:right;color:var(--text-3)}
.sys{font-size:12.5px;padding:3px 11px;border-color:var(--hair);background:rgba(12,31,74,.6)}
.qa{gap:8px}
.clock{font-family:var(--f-body);font-size:12px;color:var(--text-3)} .clock b{font:600 20px/1.2 var(--f-display);color:var(--gold)}
.bell b{font:700 11px/1 var(--f-display)}

/* commands: one button system */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 15px;border-radius:10px;border:1px solid var(--line-2);
  background:var(--surface-2);color:var(--text);font:600 14px/1.2 var(--f-body);white-space:nowrap;transition:background .15s var(--ease),border-color .15s var(--ease),transform .08s}
.btn:hover{background:#18346F;border-color:#3D66B3}
.btn:active{transform:translateY(1px)}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:transparent;box-shadow:inset 0 -2px 0 rgba(0,0,0,.16)}
.btn.gold:hover{background:var(--gold-hi)}
.btn.holo{background:rgba(111,211,255,.06);border-color:rgba(111,211,255,.5);color:#A8E6FF}
.btn.holo:hover{background:rgba(111,211,255,.12);border-color:var(--holo)}
.btn.sm{min-height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.42}
.iconbtn{border-radius:9px;padding:7px}
.chip{display:inline-flex;align-items:center;min-height:32px;padding:0 14px;font:500 13.5px/1 var(--f-body);background:transparent;border-color:var(--line-2);color:var(--text-2)}
.chip:hover{color:var(--text);border-color:#3D66B3}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:transparent;font-weight:600}
.field{min-height:42px;border-radius:10px;background:#081A40;border-color:var(--line-2);padding:8px 12px;font-size:var(--t-md)}
.field:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(243,196,64,.16)}
textarea.field{line-height:1.7}

/* nav rail */
.rail{border-left:1px solid var(--hair);padding:12px 8px;gap:2px}
.rail a{font:500 12px/1.35 var(--f-body);padding:9px 2px 8px;border-radius:10px;color:var(--text-3)}
.rail a svg{width:21px;height:21px}
.rail a:hover{color:var(--text);background:rgba(18,41,92,.7)}
.rail a[aria-current="page"]{color:var(--gold);background:rgba(243,196,64,.09);border-color:transparent;box-shadow:inset -3px 0 0 var(--gold)}

/* page title: the sheet's title, no labels above it */
.main{gap:20px;padding-top:24px}
.view-h{align-items:flex-end;padding-bottom:16px;border-bottom:1px solid var(--hair)}
.view-h h1{font-size:var(--t-2xl);font-weight:700;line-height:1.25}
.view-h p{font-size:var(--t-md);line-height:1.75;color:var(--text-2);max-width:70ch;margin-top:6px}

/* sheets, cards, data */
.panel{background:var(--sheet);backdrop-filter:none;border:1px solid var(--line);border-radius:var(--r-lg)}
.panel-h{padding:14px 18px;border-bottom:1px solid var(--hair)}
.panel-h h2{font-size:var(--t-lg);font-weight:600}
.panel-b{padding:16px 18px}
.card{border-radius:var(--r-md);padding:13px 15px;border-color:var(--line);border-inline-start-width:3px;background:var(--surface)}
.card b{font:600 15px/1.5 var(--f-body)}
.card p{font-size:var(--t-sm);line-height:1.75}
.meta{gap:6px;margin-top:8px}
.pill,.kind{font:500 12px/1.6 var(--f-body);padding:1px 10px}
.kpi{border-radius:var(--r-md);padding:14px 16px;background:var(--surface);border-color:var(--line);gap:4px}
.kpi:hover{border-color:#3D66B3}
.kpi b{font-size:34px;font-weight:600;line-height:1.05}
.kpi span{font-size:13px}
.met{border-radius:var(--r-md);padding:14px 16px;gap:8px;background:var(--surface);border-color:var(--line)}
.met .k{font:500 13.5px/1.4 var(--f-body)}
.met .v{font-size:25px;font-weight:600;line-height:1.15}
.met small{font-size:12px;line-height:1.6}
table.t{font-size:var(--t-sm)} table.t th{font:600 12.5px/1.4 var(--f-body);color:var(--text-3)}
.note{font-size:13px;color:var(--text-3);line-height:1.6}
.empty{font-size:var(--t-sm);border-color:var(--line-2);border-radius:var(--r-md);padding:16px}
.wa{font-size:14.5px;line-height:1.75;border-radius:10px;background:#081A40}
.intel{border-right:1px solid var(--hair)}
.intel h2{font:600 15px/1.4 var(--f-display);color:var(--text)}
.feed-i{font-size:13.5px;border-bottom-color:var(--hair)}
.lvl{font-size:12px}

.chatbox{border-radius:20px;border:1px solid rgba(243,196,64,.22);background:rgba(7,21,54,.96);box-shadow:0 24px 70px rgba(0,8,30,.6)}

function kindPill(k){return k&&DATA_KIND[k]?`<span class="kind ${k}">${DATA_KIND[k]}</span>`:`<span class="kind na">غير متاح</span>`;}
function metricOf(key){
 if(key==="approvals"){const n=pendingTasks().length+S.requests.filter(r=>r.status==="awaiting").length;return {value:String(n),kind:"actual",source:"سجل الموافقات في الغرفة",asOf:"لحظي"};}
 if(key==="recs"){const n=S.memos.filter(m=>m.status==="pending").length;return {value:String(n),kind:"ai",source:"مذكرات القرار المعلّقة",asOf:"لحظي",note:n?"لم تُعتمد بعد":""};}
 const m=S.metrics.find(x=>x.id===key);if(m)return m;
 if(key==="active"){const n=S.kb.filter(k=>k.type==="project").length;if(n)return {value:String(n),kind:"unverified",source:"مشاريع مسجّلة في الذاكرة، مش من نظام إدارة مشاريع",asOf:""};}
 return null;}
function metricTile([key,label]){const m=metricOf(key);
 if(!m)return `<div class="met na"><span class="k">${label}</span><span class="v">غير متاح</span><small>مفيش مصدر موثّق للرقم ده لسه. ابعته لريّان بمصدره وتاريخه.</small></div>`;
 return `<div class="met"><span class="k">${label}</span><span class="v">${esc(m.value)}</span><div class="meta">${kindPill(m.kind)}${m.asOf?`<span class="pill">${esc(m.asOf)}</span>`:""}</div><small>${esc(m.source||"")}${m.note?" · "+esc(m.note):""}</small></div>`;}

 else if(t.status==="open"||t.status==="approved")acts=`<button class="btn sm" data-act="done" data-id="${t.id}">تمّت</button>`;
 const rate=t.status==="rating"?"":"";
 return `<div class="card ${lvl}" id="task-${t.id}"><b>${esc(t.title)}</b>${!compact&&t.details?`<p>${esc(t.details)}</p>`:""}

function latestBrief(){return S.briefings.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0]||null;}
function dataDigest(max){
 const L=x=>String(x||"").slice(0,180);
 const tasks=S.tasks.map(t=>`- [${t.status}/${t.approval}] ${L(t.title)} → ${(AGENT[t.agent]||{}).name||t.agent}${t.project?" · "+t.project:""}${t.due?" · حتى "+t.due:""}${t.closedAt?" · أُغلقت "+t.closedAt.slice(0,10):""}`).join("\n");
 const dec=S.decisions.slice(-15).map(d=>`- ${d.verdict}: ${L(d.title)} (${String(d.at).slice(0,10)})`).join("\n");
 const gaps=S.gaps.filter(g=>!g.answered).map(g=>`- [أولوية ${g.prio}] ${L(g.q)}`).join("\n");
 const kb=S.kb.filter(k=>["finance","project","rule","contractor"].includes(k.type)).map(k=>`- [${KB_TYPES[k.type]}] ${k.title} (${k.updated||""}): ${L(k.summary)}${k.figures?" | "+L(k.figures):""}`).join("\n");
 const mets=METRICS.map(([k,n])=>{const m=metricOf(k);return `- ${n}: ${m?`${m.value} [${DATA_KIND[m.kind]||m.kind}${m.asOf?" · "+m.asOf:""} · ${m.source||""}]`:"غير متاح"}`;}).join("\n");
 return (`المؤشرات (بنوعها وتاريخها):\n${mets}\n\nالمهام:\n${tasks||"لا يوجد"}\n\nالقرارات الأخيرة:\n${dec||"لا يوجد"}\n\nأسئلة ناقصة:\n${gaps||"لا يوجد"}\n\nالذاكرة:\n${kb}`).slice(0,max||30000);}
async function genBrief(){const st=$("#brief-status");if(!sample){st.textContent="ريّان مش متاح في العرض ده؛ حط مفتاح Claude من الإعدادات.";return;}if(!db)return;
 const btn=$("#gen-brief");btn.disabled=true;st.textContent="ريّان بيجهّز الموجز…";setMode("thinking");
 try{const j=await sample.json(`أنت ريّان، التوأم الرقمي التنفيذي لريانة (المقاولات/الابتكارات وريانة للأخشاب). جهّز الموجز الصباحي لم. محمد علاء بتاريخ ${today()} بالعامية المصرية القاهرية، جمل قصيرة وعملية، من البيانات دي فقط. ممنوع تخترع أرقام أو أحداث؛ لو قسم مفيهوش بيانات اكتب مصفوفة فاضية. اللقطات المالية قديمة فاذكر تاريخها.
رد بـ JSON فقط بالشكل ده:
{"summary":"سطرين","yesterday":["..."],"priorities":["..."],"finance":["..."],"blocked":["..."],"approvals":["..."],"risks":["..."],"opportunities":["..."],"actions":["..."],"spoken":"نص للنطق بالعامية المصرية في حدود 80 كلمة، بدون رموز"}

${dataDigest(40000)}`,{modelTier:"default",cache:false});
  if(!j||typeof j!=="object")throw {code:"invalid_json"};
  await db.doc("briefings/"+today()).set({date:today(),content:j,createdAt:nowIso()});st.textContent="الموجز جاهز";setMode("idle");}
 catch(e){setMode("idle");st.textContent=e&&e.code==="not_granted"?"محتاج توافق على استخدام Claude للصفحة.":e&&e.code==="rate_limited"?"ضغط كبير، جرّب بعد شوية.":"ما قدرتش أجهز الموجز، جرّب تاني.";}
 finally{btn.disabled=false;}}
async function playBrief(){const b=latestBrief();if(!b)return;const cards=[...document.querySelectorAll(".brief-card")];
 const txt=b.content.spoken||b.content.summary||"";let i=0;const step=Math.max(900,Math.min(2600,plain(txt).length*55/Math.max(1,cards.length)));
 const tick=setInterval(()=>{cards.forEach(c=>c.classList.remove("active"));if(i<cards.length){cards[i].classList.add("active");i++;}else{clearInterval(tick);}},step);
 await speak(txt);setTimeout(()=>{clearInterval(tick);cards.forEach(c=>c.classList.remove("active"));},step*cards.length+200);}

approval: أي دفع أو شراء أو تعاقد = red. agent المسؤول من: ${Object.keys(AGENT).join(", ")}.

مشاريع وموردين مسجّلين للمطابقة (لا تفترض تطابق غير صريح):

async function send(text){text=String(text||"").trim();if(!text||busy)return;stopSpeak();
 S.chat.push({role:"user",content:text});drawChat("");$("#box").value="";
 if(!sample){S.chat.push({role:"assistant",content:"أنا محتاج مفتاح Claude API عشان أرد وأوزّع. حطه من الإعدادات ← التحميل والنسخة المستقلة. رسالتك اتسجلت.",acts:[]});drawChat();saveChat();return;}
 busy=true;$("#send").disabled=true;$("#stop").hidden=false;setMode("thinking");ctl=new AbortController();const acts=[];
 const hist=S.chat.slice(-14).map(m=>({role:m.role,content:m.content}));while(hist.length&&hist[0].role!=="user")hist.shift();
 let started=false;
 try{const {text:ans}=await sample([{role:"user",content:rules()},...hist],{signal:ctl.signal,tools:tools(acts),onText:({text})=>{if(!started){started=true;setMode("speaking");}drawChat(text);}});
  const hits=msaHits(ans);S.chat.push({role:"assistant",content:ans,acts,msa:hits});drawChat();
  if(hits.length>=2&&sample)egyptianize(S.chat.length-1);else speak(ans);}
 catch(e){const map={not_granted:"محتاج مفتاح Claude API من الإعدادات عشان أشتغل.",bad_key:"مفتاح Claude غلط أو منتهي؛ غيّره من الإعدادات.",network:"مفيش إنترنت دلوقتي، جرّب تاني.",api_error:"Claude رجّع خطأ، جرّب تاني.",rate_limited:"فيه ضغط دلوقتي، جرّب بعد شوية.",session_expired:"محتاج تسجّل دخول تاني.",tools_unavailable:"العرض ده مش بيدعم التوزيع التلقائي.",cancelled:"وقفت."};
  S.chat.push({role:"assistant",content:(e&&e.text?e.text+"\n\n":"")+(map[e&&e.code]||"حصل عطل مؤقت، ابعت تاني."),acts});drawChat();setMode("idle");}
 finally{busy=false;$("#send").disabled=false;$("#stop").hidden=true;saveChat();if(AV.mode==="thinking")setMode("idle");}}

$("#stop").onclick=()=>{ctl&&ctl.abort();stopSpeak();};
/* ===== microphone: ElevenLabs Scribe (with key) or Chrome speech recognition (ar-EG) ===== */
const MIC={on:false,rec:null,stream:null,chunks:[],sr:null,vad:null,busy:false};
function micMsg(m){const h=$("#hint");if(h)h.textContent=m;if(NX.on){const c=$("#nx-cap");if(c)c.textContent=m;}}
function micUI(){const on=MIC.on;const b=$("#mic");if(b){b.classList.toggle("on",on);b.setAttribute("aria-pressed",String(on));b.setAttribute("aria-label",on?"وقّف الاستماع":"كلّم ريّان بالصوت");}
 const n=$("#nx-mic");if(n){n.classList.toggle("mic-on",on);n.setAttribute("aria-pressed",String(on));}const t=$("#nx-mic-t");if(t)t.textContent=on?"بسمعك… اضغط للإنهاء":MIC.busy?"بيكتب كلامك…":"كلّم ريّان";}
function micDenied(e){const n=e&&(e.name||e.error);if(!STANDALONE)return "المايك مقفول جوه claude.ai. استخدم النسخة المحمّلة على جهازك، أو اكتب لريّان.";
 if(n==="NotAllowedError"||n==="not-allowed"||n==="service-not-allowed")return "المايك مقفول للصفحة دي: اضغط أيقونة الإعدادات جنب العنوان في Chrome واسمح بالـ Microphone، وكمان اتأكد إن Chrome مسموح له بالمايك في إعدادات الماك (Privacy ← Microphone).";
 if(n==="NotFoundError"||n==="audio-capture")return "مفيش مايك متوصل بالجهاز.";if(n==="network")return "التعرف على الكلام محتاج إنترنت.";if(n==="no-speech")return "ما سمعتش كلام، جرّب تاني.";return "المايك ما اشتغلش ("+(n||"خطأ")+").";}
function vadStart(stream){try{const AC=window.AudioContext||window.webkitAudioContext;const ac=new AC();const src=ac.createMediaStreamSource(stream);const an=ac.createAnalyser();an.fftSize=1024;src.connect(an);const buf=new Uint8Array(an.fftSize);
 let heard=false,quietSince=0;const t0=performance.now();
 const tick=()=>{if(!MIC.on){ac.close();return;}an.getByteTimeDomainData(buf);let sum=0;for(const v of buf){const d=(v-128)/128;sum+=d*d;}const rms=Math.sqrt(sum/buf.length);AV.burst=Math.min(1,rms*8);
  const now=performance.now();if(rms>0.035){heard=true;quietSince=0;}else if(heard){if(!quietSince)quietSince=now;else if(now-quietSince>1400){micStop();return;}}
  if(now-t0>30000||(!heard&&now-t0>8000)){micStop();return;}requestAnimationFrame(tick);};requestAnimationFrame(tick);MIC.vad=ac;}catch(_){}}
async function micStart(){if(MIC.busy)return;if(MIC.on){micStop();return;}stopSpeak();
 if(EL.key()&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder){
  try{MIC.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});}catch(e){micMsg(micDenied(e));return;}
  MIC.chunks=[];let r;try{r=new MediaRecorder(MIC.stream);}catch(e){micMsg(micDenied(e));MIC.stream.getTracks().forEach(t=>t.stop());return;}
  MIC.rec=r;r.ondataavailable=e=>{if(e.data&&e.data.size)MIC.chunks.push(e.data);};r.onstop=micTranscribe;r.start(250);MIC.on=true;setMode("listening");micUI();micMsg("بسمعك… اتكلم واسكت لما تخلّص");vadStart(MIC.stream);return;}
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(SR){const sr=new SR();sr.lang="ar-EG";sr.interimResults=true;sr.continuous=false;sr.maxAlternatives=1;let fin="",err=null;
  sr.onresult=e=>{let t="";for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;$("#box").value=t;if(NX.on){const c=$("#nx-cap");if(c)c.textContent=t;}if(e.results[e.results.length-1].isFinal)fin=t;};
  sr.onerror=e=>{err=e;};
  sr.onend=()=>{MIC.on=false;MIC.sr=null;micUI();if(AV.mode==="listening")setMode("idle");if(err&&err.error!=="aborted"){micMsg(micDenied(err));return;}const t=(fin||$("#box").value).trim();if(t)send(t);};
  try{sr.start();}catch(e){micMsg(micDenied(e));return;}MIC.sr=sr;MIC.on=true;setMode("listening");micUI();micMsg("بسمعك…");return;}
 micMsg(STANDALONE?"المتصفح ده مش بيدعم الاستماع. استخدم Chrome.":micDenied(null));}
function micStop(){if(MIC.rec&&MIC.rec.state!=="inactive"){MIC.on=false;MIC.rec.stop();}else if(MIC.sr){MIC.sr.stop();}MIC.on=false;micUI();}
async function micTranscribe(){const stream=MIC.stream;if(stream)stream.getTracks().forEach(t=>t.stop());MIC.stream=null;
 const type=(MIC.rec&&MIC.rec.mimeType)||"audio/webm";const blob=new Blob(MIC.chunks,{type});MIC.rec=null;
 if(blob.size<2000){setMode("idle");micMsg("ما سمعتش كلام، جرّب تاني.");micUI();return;}
 MIC.busy=true;micUI();setMode("thinking");micMsg("بكتب كلامك…");
 const ext=/mp4|m4a/.test(type)?"m4a":/ogg/.test(type)?"ogg":"webm";let text="",lastErr="";
 for(const model of ["scribe_v2","scribe_v1"]){const fd=new FormData();fd.append("file",blob,"speech."+ext);fd.append("model_id",model);fd.append("tag_audio_events","false");
  let r;try{r=await fetch("https://api.elevenlabs.io/v1/speech-to-text",{method:"POST",headers:{"xi-api-key":EL.key()},body:fd});}catch(e){lastErr="ما قدرتش أوصل لـ ElevenLabs.";break;}
  if(r.status===400||r.status===422){lastErr="";continue;}
  if(!r.ok){lastErr=r.status===401?"مفتاح ElevenLabs غلط أو منتهي.":r.status===429?"ElevenLabs مشغول أو الرصيد خلص.":"ElevenLabs رجّع خطأ "+r.status+".";break;}
  try{const j=await r.json();text=String(j.text||"").trim();}catch(_){lastErr="رد ElevenLabs مش مفهوم.";}break;}
 MIC.busy=false;micUI();if(AV.mode==="thinking")setMode("idle");
 if(!text){micMsg(lastErr||"ما فهمتش الكلام، جرّب تاني.");return;}
 $("#box").value=text;if(NX.on){const c=$("#nx-cap");if(c)c.textContent="«"+text+"»";}send(text);}
$("#mic").onclick=()=>micStart();
$("#nx-mic").onclick=()=>micStart();
$("#voice-toggle").onclick=()=>{if(!V.on&&!isEgyptian(pickVoice())&&pickVoice()){$("#hint").textContent="مفيش صوت مصري على جهازك؛ الصوت المتاح هينطق بلهجة تانية.";}
 if(!pickVoice()){$("#hint").textContent="الصوت محتاج مفتاح ElevenLabs من الإعدادات.";location.hash="#config";return;}V.on=!V.on;store.set("voiceOn",V.on);if(!V.on)stopSpeak();drawVoiceToggle();drawSys();};
function openChat(){$("#chatbox").hidden=false;$("#dock").hidden=true;drawChat();}
$("#orb").onclick=()=>{if(AV.mode==="speaking")stopSpeak();openChat();};
$("#close-chat").onclick=()=>{$("#chatbox").hidden=true;$("#dock").hidden=false;};
$("#to-imm").onclick=()=>{const imm=$("#imm");imm.hidden=false;
 $("#imm-pane").innerHTML=`<div class="chat-top" style="grid-template-columns:1fr auto"><div><h2>ريّان · الوضع الغامر</h2><div class="mode ${AV.mode}">${AV.mode.toUpperCase()}</div></div><button class="iconbtn" id="imm-close" aria-label="اخرج من الوضع الغامر"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="chat-log" id="imm-log"></div><div class="composer"><label for="imm-box" class="note">اكتب لريّان</label><textarea id="imm-box"></textarea><div class="row"><button class="btn gold" id="imm-send">ابعت</button></div></div>`;
 drawChat();$("#imm-close").onclick=()=>{imm.hidden=true;};$("#imm-send").onclick=()=>{const v=$("#imm-box").value;$("#imm-box").value="";send(v);};};

/* ================= launch ================= */
function greetingText(){const p=pendingTasks().length,o=openTasks().length,g=S.gaps.filter(x=>!x.answered&&x.prio<=1).length;
 let mid="";if(S.loaded&&db){const parts=[];if(p)parts.push(`${p} حاجات محتاجة موافقتك`);if(o)parts.push(`${o} مهمة شغالة`);if(g)parts.push(`${g} أسئلة عاجلة ناقصة عندي`);mid=parts.length?` عندنا النهارده ${parts.join("، و")}.`:" الدنيا هادية النهارده.";}
 else mid=" عندنا النهارده شوية حاجات محتاجة مراجعتك.";
 return `أهلًا بيك في غرفة العمليات. أنا ريّان، مساعدك، وهكون معاك في إدارة الشركة ومتابعة كل التفاصيل.${mid} تحب نبدأ بالموجز، ولا نفتح لوحة القيادة ونشوف الدنيا ماشية إزاي؟`;}
let launchTimer=0,bgRaf=0;
function startLaunch(force){const st=$("#launch");st.hidden=false;st.classList.remove("leaving");AV.materialize=0;
 const cv=$("#launch-cv"),bg=$("#bgfx");const bctx=bg.getContext("2d");
 const resize=()=>{bg.width=innerWidth;bg.height=innerHeight;};resize();addEventListener("resize",resize);
 const dots=Array.from({length:120},(_,i)=>{const r=seeded(i+3);return {x:r(),y:r(),z:r(),v:.2+r()};});
 const tStart=performance.now();
 const frame=()=>{const t=(performance.now()-tStart)/1000;AV.materialize=Math.min(1,RM?1:Math.max(0,(t-.6)/1.6));
  bctx.clearRect(0,0,bg.width,bg.height);dots.forEach(d=>{const conv=Math.min(1,t/2.4);const x=(d.x*bg.width)*(1-conv*.35)+bg.width/2*conv*.35,y=((d.y*bg.height+t*20*d.v)%bg.height)*(1-conv*.3)+bg.height*.4*conv*.3;
   bctx.fillStyle=`rgba(95,227,255,${.15+.5*d.z*(1-conv*.5)})`;bctx.fillRect(x,y,1.5+d.z,1.5+d.z);});
  drawAvatar(cv,t,{mat:AV.materialize});
  if(!st.hidden)bgRaf=requestAnimationFrame(frame);};
 cancelAnimationFrame(bgRaf);bgRaf=requestAnimationFrame(frame);
 const gt=$("#greet-t");gt.textContent="";clearTimeout(launchTimer);
 launchTimer=setTimeout(()=>{const full=greetingText();let i=0;AV.speakUntil=performance.now()+Math.min(9000,full.length*45);setMode("speaking");
  const step=()=>{i+=2;gt.textContent=full.slice(0,i);if(i<full.length)launchTimer=setTimeout(step,RM?0:35);else{setTimeout(()=>{if(AV.mode==="speaking"&&!(window.speechSynthesis&&speechSynthesis.speaking))setMode("idle");},600);}};step();},RM?0:1900);
 setTimeout(()=>$("#enter").focus(),100);}
function endLaunch(){const st=$("#launch");st.classList.add("leaving");clearTimeout(launchTimer);setTimeout(()=>{st.hidden=true;cancelAnimationFrame(bgRaf);if(AV.mode==="speaking"&&!(window.speechSynthesis&&speechSynthesis.speaking))setMode("idle");},RM?0:700);}
$("#enter").onclick=endLaunch;
$("#hear").onclick=()=>{const pv=pickVoice();if(!pv){$("#launch-hint").textContent="مفيش صوت عربي على جهازك؛ الكلام مكتوب قدامك.";return;}
 if(!isEgyptian(pv))$("#launch-hint").textContent="تنبيه: الصوت المتاح على جهازك مش مصري، فالنطق هيختلف عن الكلام المكتوب.";
 const was=V.on;V.on=true;speak(greetingText()).then(()=>{V.on=was;});};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!$("#launch").hidden)endLaunch();else if(!$("#imm").hidden)$("#imm").hidden=true;}});

/* ================= clock ================= */
function tick(){const d=new Date();if($("#nx-clk")){$("#nx-clk").textContent=d.toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit",hour12:false});$("#nx-dt").textContent=d.toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"})+" · الدمام";}$("#clk").textContent=d.toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"});$("#dt").textContent=d.toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"});}
tick();setInterval(tick,30000);

/* ================= boot ================= */
addCanvas($("#orb-cv"),{small:true});addCanvas($("#chat-cv"),{small:true});addCanvas($("#imm-cv"),{});
requestAnimationFrame(loop);
try{if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}}catch(_){}
drawVoiceToggle();route();drawIntel();drawSys();drawChat();if(cur==="core")nxBoot();

const C=window.claude;
if(C&&C.use){
 C.use("sample").then(s=>{sample=s;capsDone.sample=true;if(!s)$("#hint").textContent="ريّان محتاج مفتاح Claude API من الإعدادات";refresh();});
 C.use("mcp").then(m=>{mcp=m;capsDone.mcp=true;refresh();});
 C.use("downloads").then(d=>{dl=d;if(cur==="config")drawDownloads();});
 C.use("db").then(d=>{db=d;capsDone.db=true;if(!d){S.loaded=true;refresh();return;}
  const sub=(name,key)=>d.collection(name).onSnapshot(snap=>{S[key]=snap.docs.map(x=>normRow(key,{id:x.id,...x.data()}));S.loaded=true;refresh();},err=>console.warn(name,err));
  sub("kb","kb");sub("tasks","tasks");sub("gaps","gaps");sub("line","line");sub("decisions","decisions");sub("briefings","briefings");sub("meetings","meetings");
  sub("metrics","metrics");sub("policies","policies");sub("people","people");sub("requests","requests");sub("memos","memos");
  d.doc("config/line").onSnapshot(s=>{S.cfg=s.exists?(s.data()||{}):{};refresh();},err=>console.warn(err));
  d.doc("chat/log").onSnapshot(s=>{if(busy)return;S.chat=s.exists?(s.data().messages||[]):[];drawChat();},err=>console.warn(err));});
}else{S.loaded=true;capsDone.sample=capsDone.db=capsDone.mcp=true;refresh();}
})();
